      "notes": "~18 s. \"Renting out an apartment gives you a second job. This is a landlord's phone on a Tuesday evening.\" [click] (notifications pour in) \"Is it still available? Can I come to a viewing? Do you accept pets? And the rent hasn't arrived. Plus 23 more.\" [click] \"Research backs this up: in the UK, small landlords spend 18 hours a month managing their rentals.\" [click] \"In our interviews we heard it more than once: most hours go to applicants who were never a fit.\" Don't mention Nuomity yet. If asked: Pegasus Insight, Landlord Trends, Oct 2026, landlords with 1–5 properties; all landlords average 33 h a month, self-managing landlords 51 h."

      "notes": "~21 s, the video starts by itself on the same phone: talk over it, click on when it ends. \"Nuomity turns those 28 messages into one link. Applicants apply through it and land in one list, book a viewing themselves, get screened, and the lease is signed digitally. The landlord only gets a few emails along the way. This is the MVP we're building now.\""

      "notes": "~22 s. \"Our model: it's free to start, including contracts and e-signing. Landlords pay EUR 14.90 for each applicant they screen, and a flat EUR 10 a month for rental management.\" [click] \"So one rental is worth about EUR 135 a year to us.\" [click] \"Our target customers: almost 35 thousand landlords in Lithuania rent out homes with a business certificate. That's about 4.7 million euros a year, counting just one rental each. And Latvia, Estonia and Poland have the same problem.\" This is the planned pricing. If asked: 34,888 = people with a VMI business certificate for residential rental in 2025, the landlords who run renting as a business; overall, 126 thousand people declared rental income from housing in 2023 (VMI), so the wider market is larger. EUR 135 = one new tenant a year, screened once (EUR 14.90) + 12 months of management (EUR 120); insurance commissions are under exploration and not counted."

      "notes": "~22 s. \"Others cover the listing and the lease. OpenRent in the UK and Rendin in Estonia list the home, and they, like Zent and Owntly here in Lithuania, handle screening, contracts and rent. Landlords pay for it.\" [click] \"But the hours go in between: answering applicants and arranging viewings. None of them books viewings for the landlord.\" [click] \"That is where Nuomity starts, from the first application to the signed contract, and rental management comes next.\" If asked: OpenRent publishes the listing and handles referencing (add-on), digital tenancy agreements and rent collection; enquiries go to the landlord, who arranges and conducts viewings. Rendin: free listing with ID-screened candidates, rent guarantee instead of a deposit, digital contracts. Zent (an Aruodas.lt project): insurance instead of a deposit, credit check, e-contract, rent paid out on schedule. Owntly: starts once a tenant is found; screening, e-signing, rent tracking, utilities, chat. Aruodas.lt is a listing portal, not a competitor: enquiries arrive as messages, so it is a channel for us. Abroad, EliseAI (US) automates leasing with AI for large operators. Sources: OpenRent (Wikipedia, 2022; August 2026 review), Rendin (Vestbee, 2024; rendin.ee), zent.lt, owntly.com (Oct 2026)."
